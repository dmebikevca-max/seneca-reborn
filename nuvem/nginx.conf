worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
	access_log off;
	client_body_temp_path /tmp/nginx_client;
	proxy_temp_path /tmp/nginx_proxy;
	fastcgi_temp_path /tmp/nginx_fcgi;
	uwsgi_temp_path /tmp/nginx_uwsgi;
	scgi_temp_path /tmp/nginx_scgi;
	include /etc/nginx/mime.types;
	map $http_upgrade $connection_upgrade { default upgrade; '' close; }
	server {
		listen __PORTA__;
		# jogadores (WebSocket) -> servidor do jogo
		location /ws {
			proxy_pass http://127.0.0.1:24681;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
			proxy_buffering off;
		}
		# estado do servidor (o jogo consulta para acordar o servidor antes de conectar)
		location = /status.json {
			alias /tmp/seneca_status.json;
			default_type application/json;
			add_header Cache-Control no-store;
			add_header Access-Control-Allow-Origin *;
		}
		location / {
			root /home/jogo/app;
			try_files /pagina.html =404;
		}
	}
}
